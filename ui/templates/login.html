{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Home Server Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-body-secondary bg-gradient">

<div class="container">
  <div class="row min-vh-100 align-items-center justify-content-center g-5 py-4">

   

    <!-- Right: login card -->
    <div class="col-12 col-md-8 col-lg-5">

      <a href="/" class="d-lg-none d-block text-center fw-bold fs-5 mb-4 text-decoration-none text-body">
        <i class="bi bi-hdd-rack-fill text-primary me-2"></i>Home Server Console
      </a>

      <div class="card border-primary shadow-lg">
        <div class="card-body p-4 p-md-5">

          <div class="text-center mb-4">
            <div class="text-bg-primary rounded-circle d-inline-flex align-items-center justify-content-center p-3 mb-3">
              <i class="bi bi-person-lock fs-1"></i>
            </div>
            <h1 class="h3 fw-bold mb-1">Welcome back</h1>
            <p class="text-body-secondary mb-0">Log in to open your dashboard.</p>
          </div>

          {% if message %}
            <div class="alert alert-info d-flex align-items-center py-2" role="alert">
              <i class="bi bi-info-circle-fill me-2"></i><div>{{ message }}</div>
            </div>
          {% endif %}
          {% if error %}
            <div class="alert alert-danger d-flex align-items-center py-2" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i><div>{{ error }}</div>
            </div>
          {% endif %}

          <form method="post" action="{% url 'login_verify' %}">
            {% csrf_token %}

            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="Your username" autocomplete="username" autofocus required>
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text"><i class="bi bi-key"></i></span>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Your password" autocomplete="current-password" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100">
              <i class="bi bi-box-arrow-in-right me-2"></i>Log in
            </button>
          </form>

          <hr class="my-4 border-secondary-subtle">

          <p class="text-center text-body-secondary mb-0">
            Don't have an account?
            <a href="{% url 'register' %}" class="link-info fw-semibold">Register here</a>
          </p>
        </div>
      </div>

    
    </div>

  </div>
</div>

</body>
</html>
